name: kairos-sim-full-path-gate-20260923-r2

# A disposable, internal-only proof for one sealed simulator replay. It has no
# durable host storage, credentials, or external endpoint configuration.
services:
  timescaledb:
    image: timescale/timescaledb:2.30.1-pg16@sha256:f495f2bc25ca7596ca8e1606c6241ca250ccc56a0c082b9f2ec0d290e0126cd9
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: synthetic_sim_full_path_gate_only
      POSTGRES_DB: kairos_sim_full_path_gate_202609230002
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "max_worker_processes=8", "-c", "timescaledb.max_background_workers=4"]
    tmpfs:
      - /var/lib/postgresql/data:rw,nosuid,size=512m
    shm_size: 128m
    mem_limit: 768m
    networks: [isolated]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos -d kairos_sim_full_path_gate_202609230002"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"

  gate:
    build:
      context: tests/sim_full_path_gate
      dockerfile: Dockerfile
    image: kairos-sim-full-path-gate-tests:20260923-r2
    environment:
      KAIROS_SIM_FULL_PATH_GATE_CONFIRM: ISOLATED_SIMULATOR_FULL_PATH_GATE_ONLY
      KAIROS_SIM_FULL_PATH_GATE_PROJECT: kairos-sim-full-path-gate-20260923-r2
      KAIROS_SIM_FULL_PATH_GATE_DATABASE_URL: postgresql://kairos:synthetic_sim_full_path_gate_only@timescaledb:5432/kairos_sim_full_path_gate_202609230002
    depends_on:
      timescaledb: {condition: service_healthy}
    read_only: true
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 128
    tmpfs: ["/tmp:rw,nosuid,size=256m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [isolated]
    restart: "no"

networks:
  isolated:
    internal: true
