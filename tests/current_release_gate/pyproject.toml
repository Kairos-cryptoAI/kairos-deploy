[project]
name = "kairos-current-release-gate-tests"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "kairos-core==0.3.0",
  "kairos-persistence==0.1.0",
  "kairos-strategy-engine==0.2.11",
  "kairos-router==0.2.0",
  "kairos-llm==0.1.0",
  "kairos-aggregator==0.2.0",
  "kairos-risk-manager==0.2.0",
  "kairos-execution-engine==0.1.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.uv]
package = false
required-version = "==0.12.3"
# Downstream snapshots still declare the prior persistence revision. Pin the
# source-lock-verified current revision so uv cannot resolve stale core metadata.
override-dependencies = [
  "kairos-core @ git+https://github.com/Kairos-cryptoAI/kairos-core.git@0c8717c18d535465ae89c51bcd958b0884ec02ab",
  "kairos-llm @ git+https://github.com/Kairos-cryptoAI/kairos-llm.git@2a7f0f6087186fb7495124e434b8dbfd8fa73e45",
  "kairos-persistence @ git+https://github.com/Kairos-cryptoAI/kairos-persistence.git@8aa90fd8ac1248efa5d996544d36ae0b7acdcb3e",
]

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "0c8717c18d535465ae89c51bcd958b0884ec02ab" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "8aa90fd8ac1248efa5d996544d36ae0b7acdcb3e" }
kairos-strategy-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git", rev = "dc99311384c65d45ff173728e0d1b3dcdd11cdee" }
kairos-router = { git = "https://github.com/Kairos-cryptoAI/kairos-router.git", rev = "af714562c50cd5e79c76e60f044793543a8b14d8" }
kairos-llm = { git = "https://github.com/Kairos-cryptoAI/kairos-llm.git", rev = "2a7f0f6087186fb7495124e434b8dbfd8fa73e45" }
kairos-aggregator = { git = "https://github.com/Kairos-cryptoAI/kairos-aggregator.git", rev = "ab85689ef1494e26cc86e3a2a1a66c6c7a315f1d" }
kairos-risk-manager = { git = "https://github.com/Kairos-cryptoAI/kairos-risk-manager.git", rev = "f1fcdb6c9fa5321374964f532d4c2d04574075bf" }
kairos-execution-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-execution-engine.git", rev = "eeb2732c469ec7081db3ddc619d74ce40e38fe01" }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
