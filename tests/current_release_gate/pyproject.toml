[project]
name = "kairos-current-release-gate-tests"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "kairos-core==0.3.0",
  "kairos-persistence==0.1.0",
  "kairos-strategy-engine==0.2.11",
  "kairos-router==0.2.0",
  "kairos-llm==0.1.0",
  "kairos-aggregator==0.2.0",
  "kairos-risk-manager==0.2.0",
  "kairos-execution-engine==0.1.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.uv]
package = false
required-version = "==0.12.3"
# Downstream snapshots still declare the prior persistence revision. Pin the
# source-lock-verified current revision so uv cannot resolve stale core metadata.
override-dependencies = [
  "kairos-core @ git+https://github.com/Kairos-cryptoAI/kairos-core.git@0c8717c18d535465ae89c51bcd958b0884ec02ab",
  "kairos-llm @ git+https://github.com/Kairos-cryptoAI/kairos-llm.git@21efd81bc3cd4bb50734a4c32da3d0f5f5738d43",
  "kairos-persistence @ git+https://github.com/Kairos-cryptoAI/kairos-persistence.git@104880fdb150b70a70e1b52eedd14d489c2b9fb7",
]

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "0c8717c18d535465ae89c51bcd958b0884ec02ab" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "104880fdb150b70a70e1b52eedd14d489c2b9fb7" }
kairos-strategy-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git", rev = "a4430b23927342cc45f50473530e86a079560f46" }
kairos-router = { git = "https://github.com/Kairos-cryptoAI/kairos-router.git", rev = "9aa702677d66071ff56fc534cac3d48690b19e51" }
kairos-llm = { git = "https://github.com/Kairos-cryptoAI/kairos-llm.git", rev = "21efd81bc3cd4bb50734a4c32da3d0f5f5738d43" }
kairos-aggregator = { git = "https://github.com/Kairos-cryptoAI/kairos-aggregator.git", rev = "b7a557581b2f002b238c0aad577aed5e5226c452" }
kairos-risk-manager = { git = "https://github.com/Kairos-cryptoAI/kairos-risk-manager.git", rev = "ae276eb6569ba1f8219bfb426526d0a8ae7274d1" }
kairos-execution-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-execution-engine.git", rev = "bb334e632f4ef2023fe2f77534208acea46735b0" }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
