[project]
name = "kairos-current-release-gate-tests"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "kairos-core==0.3.0",
  "kairos-persistence==0.1.0",
  "kairos-strategy-engine==0.2.11",
  "kairos-router==0.2.0",
  "kairos-llm==0.1.0",
  "kairos-aggregator==0.2.0",
  "kairos-risk-manager==0.2.0",
  "kairos-execution-engine==0.1.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.uv]
package = false
required-version = "==0.12.3"
# Downstream snapshots still declare the prior persistence revision. Pin the
# source-lock-verified current revision so uv cannot resolve stale core metadata.
override-dependencies = [
  "kairos-core @ git+https://github.com/Kairos-cryptoAI/kairos-core.git@2b3b0d5b3966eebc8a8f59a8557dd1cc505a933d",
  "kairos-llm @ git+https://github.com/Kairos-cryptoAI/kairos-llm.git@54ef1176720a1e078c947d8217468b3c66f07382",
  "kairos-persistence @ git+https://github.com/Kairos-cryptoAI/kairos-persistence.git@3ff23687bf559be84b318e47588b61f8cf4e0ece",
]

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "2b3b0d5b3966eebc8a8f59a8557dd1cc505a933d" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "3ff23687bf559be84b318e47588b61f8cf4e0ece" }
kairos-strategy-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git", rev = "61762aefb930d259e1521ff390d3509b7bffa6d2" }
kairos-router = { git = "https://github.com/Kairos-cryptoAI/kairos-router.git", rev = "c9776497c2f50943c9a20bfe1b0f19bc715c1a21" }
kairos-llm = { git = "https://github.com/Kairos-cryptoAI/kairos-llm.git", rev = "54ef1176720a1e078c947d8217468b3c66f07382" }
kairos-aggregator = { git = "https://github.com/Kairos-cryptoAI/kairos-aggregator.git", rev = "1a8c0acd1acf880f66f06da442ff7a40554299c4" }
kairos-risk-manager = { git = "https://github.com/Kairos-cryptoAI/kairos-risk-manager.git", rev = "7e9a5dc3340805d942fba758876eea6f44c6a0ce" }
kairos-execution-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-execution-engine.git", rev = "f708001b7e03992ff40831708bac1e3da748da14" }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
