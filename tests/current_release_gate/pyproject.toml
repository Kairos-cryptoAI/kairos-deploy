[project]
name = "kairos-current-release-gate-tests"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "kairos-core==0.3.0",
  "kairos-persistence==0.1.0",
  "kairos-strategy-engine==0.2.11",
  "kairos-router==0.2.0",
  "kairos-llm==0.1.0",
  "kairos-aggregator==0.2.0",
  "kairos-risk-manager==0.2.0",
  "kairos-execution-engine==0.1.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.uv]
package = false
required-version = "==0.12.3"
# Downstream snapshots still declare the prior persistence revision. Pin the
# source-lock-verified current revision so uv cannot resolve stale core metadata.
override-dependencies = [
  "kairos-core @ git+https://github.com/Kairos-cryptoAI/kairos-core.git@0c8717c18d535465ae89c51bcd958b0884ec02ab",
  "kairos-llm @ git+https://github.com/Kairos-cryptoAI/kairos-llm.git@21efd81bc3cd4bb50734a4c32da3d0f5f5738d43",
  "kairos-persistence @ git+https://github.com/Kairos-cryptoAI/kairos-persistence.git@56f5d630082441abe22f6e98b019d80b687cb2f7",
]

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "0c8717c18d535465ae89c51bcd958b0884ec02ab" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "56f5d630082441abe22f6e98b019d80b687cb2f7" }
kairos-strategy-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git", rev = "a1990bf2ce0a7888a2afeffeada26075d24733ac" }
kairos-router = { git = "https://github.com/Kairos-cryptoAI/kairos-router.git", rev = "4a99b347ab924e29d159bf4b4f25c55550a0f9f9" }
kairos-llm = { git = "https://github.com/Kairos-cryptoAI/kairos-llm.git", rev = "21efd81bc3cd4bb50734a4c32da3d0f5f5738d43" }
kairos-aggregator = { git = "https://github.com/Kairos-cryptoAI/kairos-aggregator.git", rev = "3a4fe30709654cc5a56b98610a6e0a20cff86c24" }
kairos-risk-manager = { git = "https://github.com/Kairos-cryptoAI/kairos-risk-manager.git", rev = "b38e56f87c004e3dd7a65710573c5ace2a25342e" }
kairos-execution-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-execution-engine.git", rev = "eaa17aa3ba0df425c0b67296bbf8f10075bfe421" }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
