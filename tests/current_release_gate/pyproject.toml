[project]
name = "kairos-current-release-gate-tests"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "kairos-core==0.3.0",
  "kairos-persistence==0.1.0",
  "kairos-strategy-engine==0.2.12",
  "kairos-router==0.2.0",
  "kairos-llm==0.1.0",
  "kairos-aggregator==0.2.0",
  "kairos-risk-manager==0.2.0",
  "kairos-execution-engine==0.1.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.uv]
package = false
required-version = "==0.12.3"
# Pin the exact current-release source set so uv cannot resolve mixed revisions.
override-dependencies = [
  "kairos-core @ git+https://github.com/Kairos-cryptoAI/kairos-core.git@6937eb4773fc00afaf5ba4e020b28b689f48e377",
  "kairos-llm @ git+https://github.com/Kairos-cryptoAI/kairos-llm.git@eb70fa0558463b2bd5a438c1e5a9d9613024f54b",
  "kairos-persistence @ git+https://github.com/Kairos-cryptoAI/kairos-persistence.git@11df49ce455b89fd252d5f3d948099a8e9211cb3",
]

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "6937eb4773fc00afaf5ba4e020b28b689f48e377" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "11df49ce455b89fd252d5f3d948099a8e9211cb3" }
kairos-strategy-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git", rev = "79020570cd1218152b4b8fe2195739a8e63b9c28" }
kairos-router = { git = "https://github.com/Kairos-cryptoAI/kairos-router.git", rev = "ac02f94f1380f4890334321065b3f668c367dbce" }
kairos-llm = { git = "https://github.com/Kairos-cryptoAI/kairos-llm.git", rev = "eb70fa0558463b2bd5a438c1e5a9d9613024f54b" }
kairos-aggregator = { git = "https://github.com/Kairos-cryptoAI/kairos-aggregator.git", rev = "983bcc0a494e901b25d94a87fd1d2f701ff6c07d" }
kairos-risk-manager = { git = "https://github.com/Kairos-cryptoAI/kairos-risk-manager.git", rev = "fd8bf3ec320007df1662e49d179bff7463212036" }
kairos-execution-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-execution-engine.git", rev = "baef82d865d18a4ee2772499b3d8ff0f2480367a" }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
