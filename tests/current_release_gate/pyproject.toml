[project]
name = "kairos-current-release-gate-tests"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "kairos-core==0.3.0",
  "kairos-persistence==0.1.0",
  "kairos-strategy-engine==0.2.12",
  "kairos-router==0.2.0",
  "kairos-llm==0.1.0",
  "kairos-aggregator==0.2.0",
  "kairos-risk-manager==0.2.0",
  "kairos-execution-engine==0.1.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.uv]
package = false
required-version = "==0.12.3"
# Pin the exact current-release source set so uv cannot resolve mixed revisions.
override-dependencies = [
  "kairos-core @ git+https://github.com/Kairos-cryptoAI/kairos-core.git@ff3af7592cbd47be985d794d8d9903aaa8e5df07",
  "kairos-llm @ git+https://github.com/Kairos-cryptoAI/kairos-llm.git@f67ca208d65c430d93dd6e5e242797191b4017f2",
  "kairos-persistence @ git+https://github.com/Kairos-cryptoAI/kairos-persistence.git@c6773575a09f918b4d495848705b4234f73f3a32",
]

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "ff3af7592cbd47be985d794d8d9903aaa8e5df07" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "c6773575a09f918b4d495848705b4234f73f3a32" }
kairos-strategy-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git", rev = "30d1315fdcd96b277a87cb59c1819c476344a83c" }
kairos-router = { git = "https://github.com/Kairos-cryptoAI/kairos-router.git", rev = "e7c7ddd71125abff0e5d5af0b116301bc3921890" }
kairos-llm = { git = "https://github.com/Kairos-cryptoAI/kairos-llm.git", rev = "f67ca208d65c430d93dd6e5e242797191b4017f2" }
kairos-aggregator = { git = "https://github.com/Kairos-cryptoAI/kairos-aggregator.git", rev = "edff2f56a7de4c7065d8d86d2ce2a8997d1b3133" }
kairos-risk-manager = { git = "https://github.com/Kairos-cryptoAI/kairos-risk-manager.git", rev = "4eb6de55ee68d742b2583932c2e0d8f98b65949d" }
kairos-execution-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-execution-engine.git", rev = "d544ae9d9ac4eaa1670f02c7772899c42946756c" }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
