[project]
name = "kairos-current-release-gate-tests"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "kairos-core==0.3.0",
  "kairos-persistence==0.1.0",
  "kairos-strategy-engine==0.2.11",
  "kairos-router==0.2.0",
  "kairos-llm==0.1.0",
  "kairos-aggregator==0.2.0",
  "kairos-risk-manager==0.2.0",
  "kairos-execution-engine==0.1.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.uv]
package = false
required-version = "==0.12.3"
# Downstream snapshots still declare the prior persistence revision. Pin the
# source-lock-verified current revision so uv cannot resolve stale core metadata.
override-dependencies = [
  "kairos-core @ git+https://github.com/Kairos-cryptoAI/kairos-core.git@9c8659545218147ae181cac04d22a68b5a6549ef",
  "kairos-llm @ git+https://github.com/Kairos-cryptoAI/kairos-llm.git@be14232634a47651de50fef0d64f80de871df03c",
  "kairos-persistence @ git+https://github.com/Kairos-cryptoAI/kairos-persistence.git@34b5214f366338e4b898f2d7bb46b2fcfbf4051e",
]

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "9c8659545218147ae181cac04d22a68b5a6549ef" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "34b5214f366338e4b898f2d7bb46b2fcfbf4051e" }
kairos-strategy-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git", rev = "022e5c959a282eed93290f69e8e57cbf7ebf91c8" }
kairos-router = { git = "https://github.com/Kairos-cryptoAI/kairos-router.git", rev = "d625e371250f8f0cdc27365130e33aa2d2de52b9" }
kairos-llm = { git = "https://github.com/Kairos-cryptoAI/kairos-llm.git", rev = "be14232634a47651de50fef0d64f80de871df03c" }
kairos-aggregator = { git = "https://github.com/Kairos-cryptoAI/kairos-aggregator.git", rev = "d2092158ed71e185f49f0d2af11c88a0fdd0765e" }
kairos-risk-manager = { git = "https://github.com/Kairos-cryptoAI/kairos-risk-manager.git", rev = "4efbdc1b2c4948737d77aef5b0f3d11484d1f8ba" }
kairos-execution-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-execution-engine.git", rev = "bcdd01bbe2e8281ce6251c91f150f68318ef823b" }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
