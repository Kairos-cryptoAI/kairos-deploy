[project]
name = "kairos-current-release-gate-tests"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "kairos-core==0.3.0",
  "kairos-persistence==0.1.0",
  "kairos-strategy-engine==0.2.11",
  "kairos-router==0.2.0",
  "kairos-llm==0.1.0",
  "kairos-aggregator==0.2.0",
  "kairos-risk-manager==0.2.0",
  "kairos-execution-engine==0.1.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.uv]
package = false
required-version = "==0.12.3"
# Pin the exact current-release source set so uv cannot resolve mixed revisions.
override-dependencies = [
  "kairos-core @ git+https://github.com/Kairos-cryptoAI/kairos-core.git@56df50787eff83c898aa2aeefb426c6ee8482820",
  "kairos-llm @ git+https://github.com/Kairos-cryptoAI/kairos-llm.git@fb987266c66ebcc8861e73b5b7d6f1750c32bc5e",
  "kairos-persistence @ git+https://github.com/Kairos-cryptoAI/kairos-persistence.git@63bffca5c8e6c3c77635219b368a864f03916430",
]

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "56df50787eff83c898aa2aeefb426c6ee8482820" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "63bffca5c8e6c3c77635219b368a864f03916430" }
kairos-strategy-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git", rev = "5cc18636104adac53ea2e9e50331c7b973c79f91" }
kairos-router = { git = "https://github.com/Kairos-cryptoAI/kairos-router.git", rev = "13c68701fca164947c51c24db06405683ef95439" }
kairos-llm = { git = "https://github.com/Kairos-cryptoAI/kairos-llm.git", rev = "fb987266c66ebcc8861e73b5b7d6f1750c32bc5e" }
kairos-aggregator = { git = "https://github.com/Kairos-cryptoAI/kairos-aggregator.git", rev = "4195897e4b5112b96f4683e97567cd6400a0cd90" }
kairos-risk-manager = { git = "https://github.com/Kairos-cryptoAI/kairos-risk-manager.git", rev = "8a50bbac47674f9d8613171245ff5f5cbc6a99d7" }
kairos-execution-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-execution-engine.git", rev = "29d94b95e4331410b56e49f9f7bd2e118363f5d3" }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
