[project]
name = "kairos-current-release-gate-tests"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "kairos-core==0.3.0",
  "kairos-persistence==0.1.0",
  "kairos-strategy-engine==0.2.11",
  "kairos-router==0.2.0",
  "kairos-llm==0.1.0",
  "kairos-aggregator==0.2.0",
  "kairos-risk-manager==0.2.0",
  "kairos-execution-engine==0.1.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.uv]
package = false
required-version = "==0.12.3"

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "52aba6b158a52754784162987e7af4ad24c06669" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "1ca8bf38d265ece7a95f749a268075549f80c043" }
kairos-strategy-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git", rev = "6ccbd053b07833f301e7c3beaf08ffe36f1467c4" }
kairos-router = { git = "https://github.com/Kairos-cryptoAI/kairos-router.git", rev = "23a476f20d529a5bbac231eedd5505508625432a" }
kairos-llm = { git = "https://github.com/Kairos-cryptoAI/kairos-llm.git", rev = "99f153bc9dddb13099c940e9a49d394140147d25" }
kairos-aggregator = { git = "https://github.com/Kairos-cryptoAI/kairos-aggregator.git", rev = "56e7bfbf3e5e134a18946248d37ae4554694b37b" }
kairos-risk-manager = { git = "https://github.com/Kairos-cryptoAI/kairos-risk-manager.git", rev = "4687ba923c1a514e4b8715db48d0d3e849f2c9fc" }
kairos-execution-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-execution-engine.git", rev = "53b65bb372dc7f7eb5527c844f70d577665ab96d" }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
