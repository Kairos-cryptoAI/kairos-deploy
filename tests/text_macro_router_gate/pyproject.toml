[project]
name = "kairos-text-macro-router-gate-tests"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "kairos-core==0.3.0",
  "kairos-persistence==0.1.0",
  "kairos-llm==0.1.0",
  "kairos-text-scouts==0.2.0",
  "kairos-macro-strategist==0.2.0",
  "kairos-router==0.2.0",
  "kairos-aggregator==0.2.0",
  "kairos-risk-manager==0.2.0",
  "kairos-strategy-engine==0.2.12",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.uv]
package = false
required-version = "==0.12.3"
override-dependencies = [
  "kairos-core @ git+https://github.com/Kairos-cryptoAI/kairos-core.git@6937eb4773fc00afaf5ba4e020b28b689f48e377",
  "kairos-llm @ git+https://github.com/Kairos-cryptoAI/kairos-llm.git@6d714d191f0125c07656069a8c0dbae79a345a9a",
  "kairos-persistence @ git+https://github.com/Kairos-cryptoAI/kairos-persistence.git@fd2966761e84b32688c9aee73e00604965f5d7f2",
]

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "6937eb4773fc00afaf5ba4e020b28b689f48e377" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "fd2966761e84b32688c9aee73e00604965f5d7f2" }
kairos-llm = { git = "https://github.com/Kairos-cryptoAI/kairos-llm.git", rev = "6d714d191f0125c07656069a8c0dbae79a345a9a" }
kairos-text-scouts = { git = "https://github.com/Kairos-cryptoAI/kairos-text-scouts.git", rev = "03fb454cc3e3d710df519f0852dee951da0697c5" }
kairos-macro-strategist = { git = "https://github.com/Kairos-cryptoAI/kairos-macro-strategist.git", rev = "487cb5d7945f8ee24545d209a45c1d12c4bc3167" }
kairos-router = { git = "https://github.com/Kairos-cryptoAI/kairos-router.git", rev = "cd2af6e9f3516b2a18dfb022210a70b7084c1840" }
kairos-aggregator = { git = "https://github.com/Kairos-cryptoAI/kairos-aggregator.git", rev = "30517883efd4c7063e78d8a489eb8621ceec9548" }
kairos-risk-manager = { git = "https://github.com/Kairos-cryptoAI/kairos-risk-manager.git", rev = "94eb2ff5157468714766e6b3c90d2aacfe7511a0" }
kairos-strategy-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git", rev = "cde8e9c00af0cc19848e800ee76472a800a5fd5d" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test_composed_contract.py"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
