[project]
name = "kairos-text-macro-router-gate-tests"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "kairos-core==0.3.0",
  "kairos-persistence==0.1.0",
  "kairos-llm==0.1.0",
  "kairos-text-scouts==0.2.0",
  "kairos-macro-strategist==0.2.0",
  "kairos-router==0.2.0",
  "kairos-aggregator==0.2.0",
  "kairos-risk-manager==0.2.0",
  "kairos-strategy-engine==0.2.12",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "certifi>=2026.10.19",
]

[tool.uv]
package = false
required-version = "==0.12.3"
override-dependencies = [
  "kairos-core @ git+https://github.com/Kairos-cryptoAI/kairos-core.git@ff3af7592cbd47be985d794d8d9903aaa8e5df07",
  "kairos-llm @ git+https://github.com/Kairos-cryptoAI/kairos-llm.git@d91566ba24ea72ac79203d56e8a7ec87b9d04db3",
  "kairos-persistence @ git+https://github.com/Kairos-cryptoAI/kairos-persistence.git@506628fc8686ff7373d72f37ac032e53a47b233f",
]

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "ff3af7592cbd47be985d794d8d9903aaa8e5df07" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "506628fc8686ff7373d72f37ac032e53a47b233f" }
kairos-llm = { git = "https://github.com/Kairos-cryptoAI/kairos-llm.git", rev = "d91566ba24ea72ac79203d56e8a7ec87b9d04db3" }
kairos-text-scouts = { git = "https://github.com/Kairos-cryptoAI/kairos-text-scouts.git", rev = "a8dbd889383fbe76e9429272eccfdff93e414dd3" }
kairos-macro-strategist = { git = "https://github.com/Kairos-cryptoAI/kairos-macro-strategist.git", rev = "edca44241f43a050363eeab4e89e480c9afb4dcc" }
kairos-router = { git = "https://github.com/Kairos-cryptoAI/kairos-router.git", rev = "a373e62071e8b68b29f9f4567001d330a6ef2aec" }
kairos-aggregator = { git = "https://github.com/Kairos-cryptoAI/kairos-aggregator.git", rev = "863eaa65bb9590d94d46bbe89c9da421b911c180" }
kairos-risk-manager = { git = "https://github.com/Kairos-cryptoAI/kairos-risk-manager.git", rev = "c37f6d7be446b2a906b9cba80ea31da4d12dbae3" }
kairos-strategy-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git", rev = "9ff13e780d1e936431ef7e153a34120debd21bb5" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test_composed_contract.py"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
