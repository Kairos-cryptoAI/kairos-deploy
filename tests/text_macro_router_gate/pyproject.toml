[project]
name = "kairos-text-macro-router-gate-tests"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "kairos-core==0.3.0",
  "kairos-persistence==0.1.0",
  "kairos-llm==0.1.0",
  "kairos-text-scouts==0.2.0",
  "kairos-macro-strategist==0.2.0",
  "kairos-router==0.2.0",
  "kairos-aggregator==0.2.0",
  "kairos-risk-manager==0.2.0",
  "kairos-strategy-engine==0.2.11",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.uv]
package = false
required-version = "==0.12.3"
override-dependencies = [
  "kairos-core @ git+https://github.com/Kairos-cryptoAI/kairos-core.git@6937eb4773fc00afaf5ba4e020b28b689f48e377",
  "kairos-llm @ git+https://github.com/Kairos-cryptoAI/kairos-llm.git@c6876645cb47978b49eb5ed977ee41fb7b4f8bef",
  "kairos-persistence @ git+https://github.com/Kairos-cryptoAI/kairos-persistence.git@fd2966761e84b32688c9aee73e00604965f5d7f2",
]

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "6937eb4773fc00afaf5ba4e020b28b689f48e377" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "fd2966761e84b32688c9aee73e00604965f5d7f2" }
kairos-llm = { git = "https://github.com/Kairos-cryptoAI/kairos-llm.git", rev = "c6876645cb47978b49eb5ed977ee41fb7b4f8bef" }
kairos-text-scouts = { git = "https://github.com/Kairos-cryptoAI/kairos-text-scouts.git", rev = "b9ecf6d9ab891d0f35222d67db0d4b208cd138b7" }
kairos-macro-strategist = { git = "https://github.com/Kairos-cryptoAI/kairos-macro-strategist.git", rev = "ae6b1dab3e57c6a05407878d23db82fffd7166df" }
kairos-router = { git = "https://github.com/Kairos-cryptoAI/kairos-router.git", rev = "cd2af6e9f3516b2a18dfb022210a70b7084c1840" }
kairos-aggregator = { git = "https://github.com/Kairos-cryptoAI/kairos-aggregator.git", rev = "0559a568cbaa422143d07061f75788b3e38f5ce0" }
kairos-risk-manager = { git = "https://github.com/Kairos-cryptoAI/kairos-risk-manager.git", rev = "94eb2ff5157468714766e6b3c90d2aacfe7511a0" }
kairos-strategy-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git", rev = "ccf1ff189b3c84e058c617512d92487006a58206" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test_composed_contract.py"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
