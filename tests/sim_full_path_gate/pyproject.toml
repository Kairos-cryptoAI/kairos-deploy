[project]
name = "kairos-sim-full-path-gate-tests"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "kairos-core==0.3.0",
  "kairos-persistence==0.1.0",
  "kairos-strategy-engine==0.2.11",
  "kairos-router==0.2.0",
  "kairos-llm==0.1.0",
  "kairos-aggregator==0.2.0",
  "kairos-risk-manager==0.2.0",
  "kairos-execution-engine==0.1.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.uv]
package = false
required-version = "==0.12.3"
# Downstream snapshots still declare the prior persistence revision. Pin the
# source-lock-verified current revision so uv cannot resolve stale core metadata.
override-dependencies = [
  "kairos-core @ git+https://github.com/Kairos-cryptoAI/kairos-core.git@0c8717c18d535465ae89c51bcd958b0884ec02ab",
  "kairos-llm @ git+https://github.com/Kairos-cryptoAI/kairos-llm.git@21efd81bc3cd4bb50734a4c32da3d0f5f5738d43",
  "kairos-persistence @ git+https://github.com/Kairos-cryptoAI/kairos-persistence.git@ad566c2b61ceb5d90de3334d6e15511753562bd0",
]

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "0c8717c18d535465ae89c51bcd958b0884ec02ab" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "ad566c2b61ceb5d90de3334d6e15511753562bd0" }
kairos-strategy-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git", rev = "b7d6d2ab1259480a8c1b18748180eee8c23e029b" }
kairos-router = { git = "https://github.com/Kairos-cryptoAI/kairos-router.git", rev = "012e057266d90933acbbf79e9a55cdcd6ec2396f" }
kairos-llm = { git = "https://github.com/Kairos-cryptoAI/kairos-llm.git", rev = "21efd81bc3cd4bb50734a4c32da3d0f5f5738d43" }
kairos-aggregator = { git = "https://github.com/Kairos-cryptoAI/kairos-aggregator.git", rev = "6d79fe7c5f972acd23fc35a949940a69ae22aa7f" }
kairos-risk-manager = { git = "https://github.com/Kairos-cryptoAI/kairos-risk-manager.git", rev = "55579ed5f2ef726fda3374c2b83118cef0ae5371" }
kairos-execution-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-execution-engine.git", rev = "87c2569abae052ba8a0773cbf23ae0ed6a0cccf0" }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
