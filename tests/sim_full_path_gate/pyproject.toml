[project]
name = "kairos-sim-full-path-gate-tests"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "kairos-core==0.3.0",
  "kairos-persistence==0.1.0",
  "kairos-strategy-engine==0.2.12",
  "kairos-router==0.2.0",
  "kairos-llm==0.1.0",
  "kairos-aggregator==0.2.0",
  "kairos-risk-manager==0.2.0",
  "kairos-execution-engine==0.1.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.uv]
package = false
required-version = "==0.12.3"
# Some downstream snapshots still declare prior Core and Persistence sources.
# Pin the immutable gate source set so uv cannot resolve mixed revisions.
override-dependencies = [
  "kairos-core @ git+https://github.com/Kairos-cryptoAI/kairos-core.git@d52fd9734a27f76f8e2bdbf053d477b8e04b81c9",
  "kairos-llm @ git+https://github.com/Kairos-cryptoAI/kairos-llm.git@f67ca208d65c430d93dd6e5e242797191b4017f2",
  "kairos-persistence @ git+https://github.com/Kairos-cryptoAI/kairos-persistence.git@752c984ca276ccbb7fcbd1b60a6c75d95fe6f108",
]

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "d52fd9734a27f76f8e2bdbf053d477b8e04b81c9" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "752c984ca276ccbb7fcbd1b60a6c75d95fe6f108" }
kairos-strategy-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git", rev = "236361a40788ab80d857c7b2cd6a6a57d4440010" }
kairos-router = { git = "https://github.com/Kairos-cryptoAI/kairos-router.git", rev = "6c3c69b8b45b27e0f8f6e7caa15a193e78d5d920" }
kairos-llm = { git = "https://github.com/Kairos-cryptoAI/kairos-llm.git", rev = "f67ca208d65c430d93dd6e5e242797191b4017f2" }
kairos-aggregator = { git = "https://github.com/Kairos-cryptoAI/kairos-aggregator.git", rev = "12980c1eee7d0985057db2048afab9a5e8ac4581" }
kairos-risk-manager = { git = "https://github.com/Kairos-cryptoAI/kairos-risk-manager.git", rev = "67a45465776e0231b8a29a16acedd68dd167fee9" }
kairos-execution-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-execution-engine.git", rev = "0ef9fa71a7485215ab089ef0ede0d31adb8c5849" }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
