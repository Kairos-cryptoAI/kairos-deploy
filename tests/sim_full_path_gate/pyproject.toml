[project]
name = "kairos-sim-full-path-gate-tests"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "kairos-core==0.3.0",
  "kairos-persistence==0.1.0",
  "kairos-strategy-engine==0.2.12",
  "kairos-router==0.2.0",
  "kairos-llm==0.1.0",
  "kairos-aggregator==0.2.0",
  "kairos-risk-manager==0.2.0",
  "kairos-execution-engine==0.1.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.uv]
package = false
required-version = "==0.12.3"
# Some downstream snapshots still declare prior Core and Persistence sources.
# Pin the immutable gate source set so uv cannot resolve mixed revisions.
override-dependencies = [
  "kairos-core @ git+https://github.com/Kairos-cryptoAI/kairos-core.git@6937eb4773fc00afaf5ba4e020b28b689f48e377",
  "kairos-llm @ git+https://github.com/Kairos-cryptoAI/kairos-llm.git@74d0f5c6dceac79f7e4dd03a5cef25c3a38becf0",
  "kairos-persistence @ git+https://github.com/Kairos-cryptoAI/kairos-persistence.git@0f416ee70a451f8d2a32a7dd403d7a02bce071c9",
]

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "6937eb4773fc00afaf5ba4e020b28b689f48e377" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "0f416ee70a451f8d2a32a7dd403d7a02bce071c9" }
kairos-strategy-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git", rev = "607db0041cf054dea5aa380077cb01b9def9948e" }
kairos-router = { git = "https://github.com/Kairos-cryptoAI/kairos-router.git", rev = "c971e53c4b033bf88c4eab3c208f4efd3196f96c" }
kairos-llm = { git = "https://github.com/Kairos-cryptoAI/kairos-llm.git", rev = "74d0f5c6dceac79f7e4dd03a5cef25c3a38becf0" }
kairos-aggregator = { git = "https://github.com/Kairos-cryptoAI/kairos-aggregator.git", rev = "634b26f04b0dbc9266564083b3870583823caa0d" }
kairos-risk-manager = { git = "https://github.com/Kairos-cryptoAI/kairos-risk-manager.git", rev = "172a1bfcdd938d74d32c6c9fc7c7060e9c9497fc" }
kairos-execution-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-execution-engine.git", rev = "db638c939c42a5bd951c13c0d07406706cfd8a60" }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
