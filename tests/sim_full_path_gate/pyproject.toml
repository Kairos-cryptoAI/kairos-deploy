[project]
name = "kairos-sim-full-path-gate-tests"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "kairos-core==0.3.0",
  "kairos-persistence==0.1.0",
  "kairos-strategy-engine==0.2.12",
  "kairos-router==0.2.0",
  "kairos-llm==0.1.0",
  "kairos-aggregator==0.2.0",
  "kairos-risk-manager==0.2.0",
  "kairos-execution-engine==0.1.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.uv]
package = false
required-version = "==0.12.3"
# Some downstream snapshots still declare prior Core and Persistence sources.
# Pin the immutable gate source set so uv cannot resolve mixed revisions.
override-dependencies = [
  "kairos-core @ git+https://github.com/Kairos-cryptoAI/kairos-core.git@6937eb4773fc00afaf5ba4e020b28b689f48e377",
  "kairos-llm @ git+https://github.com/Kairos-cryptoAI/kairos-llm.git@eb70fa0558463b2bd5a438c1e5a9d9613024f54b",
  "kairos-persistence @ git+https://github.com/Kairos-cryptoAI/kairos-persistence.git@ea0c73395352f71da196270fe16659f1f0298a52",
]

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "6937eb4773fc00afaf5ba4e020b28b689f48e377" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "ea0c73395352f71da196270fe16659f1f0298a52" }
kairos-strategy-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git", rev = "977f71c18354279c432856fdc0c1858b5606c49d" }
kairos-router = { git = "https://github.com/Kairos-cryptoAI/kairos-router.git", rev = "bb3eb590d50386e3af7f12882ff600c6aaf9442c" }
kairos-llm = { git = "https://github.com/Kairos-cryptoAI/kairos-llm.git", rev = "eb70fa0558463b2bd5a438c1e5a9d9613024f54b" }
kairos-aggregator = { git = "https://github.com/Kairos-cryptoAI/kairos-aggregator.git", rev = "42f785461ffeeee4b9aeda2fa7dc43134e8bf118" }
kairos-risk-manager = { git = "https://github.com/Kairos-cryptoAI/kairos-risk-manager.git", rev = "908809200a49ec8091ce9f4d6208f461d2ee43c7" }
kairos-execution-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-execution-engine.git", rev = "a12aa8e66662b212045d2a39a6a9e1d7e785c784" }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
