[project]
name = "kairos-sim-full-path-gate-tests"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "kairos-core==0.3.0",
  "kairos-persistence==0.1.0",
  "kairos-strategy-engine==0.2.11",
  "kairos-router==0.2.0",
  "kairos-llm==0.1.0",
  "kairos-aggregator==0.2.0",
  "kairos-risk-manager==0.2.0",
  "kairos-execution-engine==0.1.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.uv]
package = false
required-version = "==0.12.3"
# All downstream source snapshots still declare the earlier persistence SHA.
# The only delta to 73339c8 is the OCI-runner publication workflow, so the
# simulator gate resolves the current reviewed source explicitly rather than
# mixing it with a transitive historical source URL.
override-dependencies = [
  "kairos-persistence @ git+https://github.com/Kairos-cryptoAI/kairos-persistence.git@73339c88e67a2e0ee146a3d403cf4b7b4e075f27",
]

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "4832a407bb94eb82abee84fe5c8a1de828c37833" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "73339c88e67a2e0ee146a3d403cf4b7b4e075f27" }
kairos-strategy-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git", rev = "b7d6d2ab1259480a8c1b18748180eee8c23e029b" }
kairos-router = { git = "https://github.com/Kairos-cryptoAI/kairos-router.git", rev = "012e057266d90933acbbf79e9a55cdcd6ec2396f" }
kairos-llm = { git = "https://github.com/Kairos-cryptoAI/kairos-llm.git", rev = "5dff1e7597cb9c124312dcd42247afe649005eb5" }
kairos-aggregator = { git = "https://github.com/Kairos-cryptoAI/kairos-aggregator.git", rev = "6d79fe7c5f972acd23fc35a949940a69ae22aa7f" }
kairos-risk-manager = { git = "https://github.com/Kairos-cryptoAI/kairos-risk-manager.git", rev = "55579ed5f2ef726fda3374c2b83118cef0ae5371" }
kairos-execution-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-execution-engine.git", rev = "87c2569abae052ba8a0773cbf23ae0ed6a0cccf0" }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
