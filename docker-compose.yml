# Kairos production-like local topology.
#
# `.env` is used only for Compose interpolation. It is never injected wholesale
# into a container: every service below has an explicit environment allow-list.
name: kairos

x-common-environment: &common-environment
  KAIROS_ENVIRONMENT: ${KAIROS_ENVIRONMENT:-prod}
  KAIROS_LOG_LEVEL: ${KAIROS_LOG_LEVEL:-INFO}
  KAIROS_LOG_JSON: ${KAIROS_LOG_JSON:-true}
  KAIROS_BUS_BACKEND: redis
  KAIROS_SECRET_BINDINGS: KAIROS_REDIS_URL=/run/secrets/redis_url,KAIROS_PERSISTENCE_DATABASE_URL=/run/secrets/persistence_database_url
  KAIROS_TRADING_SYMBOLS: '${KAIROS_TRADING_SYMBOLS:-["BTCUSDT","ETHUSDT","SOLUSDT","BNBUSDT","XRPUSDT"]}'

x-redis-url-secret: &redis-url-secret
  source: redis_url
  target: redis_url

x-persistence-url-secret: &persistence-url-secret
  source: persistence_database_url
  target: persistence_database_url

x-deepseek-secret: &deepseek-secret
  source: deepseek_api_key
  target: deepseek_api_key

x-openai-secret: &openai-secret
  source: openai_api_key
  target: openai_api_key

x-x-bearer-secret: &x-bearer-secret
  source: x_bearer_token
  target: x_bearer_token

x-python-build: &python-build
  context: .
  dockerfile: docker/Dockerfile
  pull: true

x-python-service: &python-service
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  depends_on:
    redis:
      condition: service_healthy
    timescaledb:
      condition: service_healthy
  secrets:
    - *redis-url-secret
    - *persistence-url-secret
  stop_grace_period: 30s
  logging: &default-logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  redis:
    image: redis:8.4.5-alpine3.22@sha256:bd4a0d37e7cd830117ffec9329052b4a1887afa060c265e1768f82b177ff6f43
    user: redis:redis
    pull_policy: always
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        password=$$(cat /run/secrets/redis_password)
        test -n "$$password"
        printf 'appendonly yes\nappendfsync everysec\nrequirepass %s\n' "$$password" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    secrets:
      - redis_password
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - bus
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  timescaledb:
    image: timescale/timescaledb:2.30.1-pg16@sha256:f495f2bc25ca7596ca8e1606c6241ca250ccc56a0c082b9f2ec0d290e0126cd9
    user: postgres:postgres
    pull_policy: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-kairos}
    secrets:
      - postgres_password
    volumes:
      - ts-data:/var/lib/postgresql/data
      - ./timescaledb/schema.sql:/docker-entrypoint-initdb.d/001-kairos.sql:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = postgres && pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  quant-scouts:
    <<: *python-service
    build:
      <<: *python-build
      additional_contexts:
        service: https://github.com/Kairos-cryptoAI/kairos-quant-scouts.git#74ee29aed90f5fa62410b351537232293cffce2c
      args:
        PACKAGE_DIR: kairos_quant
        SOURCE_REPOSITORY: https://github.com/Kairos-cryptoAI/kairos-quant-scouts
        SOURCE_REVISION: 74ee29aed90f5fa62410b351537232293cffce2c
    command: ["kairos-quant-scouts"]
    environment:
      <<: *common-environment
    networks:
      - bus
      - data
      - egress
      - observability

  strategy-engine:
    <<: *python-service
    build:
      <<: *python-build
      additional_contexts:
        service: https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git#022e5c959a282eed93290f69e8e57cbf7ebf91c8
      args:
        PACKAGE_DIR: kairos_strategy
        SERVICE_EXTRA: runtime
        SOURCE_REPOSITORY: https://github.com/Kairos-cryptoAI/kairos-strategy-engine
        SOURCE_REVISION: 022e5c959a282eed93290f69e8e57cbf7ebf91c8
    command: ["kairos-strategy-engine"]
    environment:
      <<: *common-environment
      KAIROS_TRADING_MODE: DRY_RUN
      KAIROS_ENABLED_STRATEGY_IDS: '[]'
    networks:
      - bus
      - data
      - observability

  text-scouts:
    <<: *python-service
    build:
      <<: *python-build
      additional_contexts:
        service: https://github.com/Kairos-cryptoAI/kairos-text-scouts.git#57c43a264977f5326e1b12aaf1c5e58f51e8cc60
      args:
        PACKAGE_DIR: kairos_text
        SOURCE_REPOSITORY: https://github.com/Kairos-cryptoAI/kairos-text-scouts
        SOURCE_REVISION: 57c43a264977f5326e1b12aaf1c5e58f51e8cc60
    command: ["kairos-text-scouts"]
    environment:
      <<: *common-environment
      KAIROS_SECRET_BINDINGS: KAIROS_REDIS_URL=/run/secrets/redis_url,KAIROS_PERSISTENCE_DATABASE_URL=/run/secrets/persistence_database_url,KAIROS_DEEPSEEK_API_KEY=/run/secrets/deepseek_api_key,KAIROS_X_BEARER_TOKEN=/run/secrets/x_bearer_token
      KAIROS_REDDIT_USER_AGENT: ${KAIROS_REDDIT_USER_AGENT:-kairos-text-scouts/0.1 by Kairos-cryptoAI}
      KAIROS_X_MONTHLY_BUDGET_MICROUSD: ${KAIROS_X_MONTHLY_BUDGET_MICROUSD:-2000000}
      KAIROS_X_POST_READ_UNIT_COST_MICROUSD: ${KAIROS_X_POST_READ_UNIT_COST_MICROUSD:-5000}
      KAIROS_X_USER_READ_UNIT_COST_MICROUSD: ${KAIROS_X_USER_READ_UNIT_COST_MICROUSD:-10000}
    secrets:
      - *redis-url-secret
      - *persistence-url-secret
      - *deepseek-secret
      - *x-bearer-secret
    networks:
      - bus
      - data
      - egress
      - observability

  router:
    <<: *python-service
    build:
      <<: *python-build
      additional_contexts:
        service: https://github.com/Kairos-cryptoAI/kairos-router.git#d625e371250f8f0cdc27365130e33aa2d2de52b9
      args:
        PACKAGE_DIR: kairos_router
        SOURCE_REPOSITORY: https://github.com/Kairos-cryptoAI/kairos-router
        SOURCE_REVISION: d625e371250f8f0cdc27365130e33aa2d2de52b9
    command: ["kairos-router"]
    environment:
      <<: *common-environment
    networks:
      - bus
      - data
      - observability

  aggregator:
    <<: *python-service
    build:
      <<: *python-build
      additional_contexts:
        service: https://github.com/Kairos-cryptoAI/kairos-aggregator.git#d2092158ed71e185f49f0d2af11c88a0fdd0765e
      args:
        PACKAGE_DIR: kairos_aggregator
        SOURCE_REPOSITORY: https://github.com/Kairos-cryptoAI/kairos-aggregator
        SOURCE_REVISION: d2092158ed71e185f49f0d2af11c88a0fdd0765e
    command: ["kairos-aggregator"]
    environment:
      <<: *common-environment
      KAIROS_SECRET_BINDINGS: KAIROS_REDIS_URL=/run/secrets/redis_url,KAIROS_PERSISTENCE_DATABASE_URL=/run/secrets/persistence_database_url,KAIROS_OPENAI_API_KEY=/run/secrets/openai_api_key
    secrets:
      - *redis-url-secret
      - *persistence-url-secret
      - *openai-secret
    networks:
      - bus
      - data
      - egress
      - observability

  macro-strategist:
    <<: *python-service
    build:
      <<: *python-build
      additional_contexts:
        service: https://github.com/Kairos-cryptoAI/kairos-macro-strategist.git#3b8af1335162d9b279d1c206b0a84f924931d84f
      args:
        PACKAGE_DIR: kairos_macro
        SOURCE_REPOSITORY: https://github.com/Kairos-cryptoAI/kairos-macro-strategist
        SOURCE_REVISION: 3b8af1335162d9b279d1c206b0a84f924931d84f
    command: ["kairos-macro-strategist"]
    environment:
      <<: *common-environment
      KAIROS_SECRET_BINDINGS: KAIROS_REDIS_URL=/run/secrets/redis_url,KAIROS_PERSISTENCE_DATABASE_URL=/run/secrets/persistence_database_url,KAIROS_OPENAI_API_KEY=/run/secrets/openai_api_key
    secrets:
      - *redis-url-secret
      - *persistence-url-secret
      - *openai-secret
    networks:
      - bus
      - data
      - egress
      - observability

  risk-manager:
    <<: *python-service
    build:
      <<: *python-build
      additional_contexts:
        service: https://github.com/Kairos-cryptoAI/kairos-risk-manager.git#4efbdc1b2c4948737d77aef5b0f3d11484d1f8ba
      args:
        PACKAGE_DIR: kairos_risk
        SOURCE_REPOSITORY: https://github.com/Kairos-cryptoAI/kairos-risk-manager
        SOURCE_REVISION: 4efbdc1b2c4948737d77aef5b0f3d11484d1f8ba
    command: ["kairos-risk-manager"]
    environment:
      <<: *common-environment
      KAIROS_REQUIRE_RECONCILED_ACCOUNT: "true"
      KAIROS_ACCOUNT_SNAPSHOT_MAX_AGE_S: ${KAIROS_ACCOUNT_SNAPSHOT_MAX_AGE_S:-60}
      KAIROS_REQUIRE_STRATEGIC_ALLOCATION: "true"
    networks:
      - bus
      - data
      - observability

  execution-engine:
    <<: *python-service
    build:
      <<: *python-build
      additional_contexts:
        service: https://github.com/Kairos-cryptoAI/kairos-execution-engine.git#bcdd01bbe2e8281ce6251c91f150f68318ef823b
      args:
        PACKAGE_DIR: kairos_execution
        SERVICE_EXTRA: evedex
        SOURCE_REPOSITORY: https://github.com/Kairos-cryptoAI/kairos-execution-engine
        SOURCE_REVISION: bcdd01bbe2e8281ce6251c91f150f68318ef823b
    command: ["kairos-execution-engine"]
    environment:
      <<: *common-environment
      KAIROS_EXCHANGE: evedex
      KAIROS_TRADING_MODE: DRY_RUN
      KAIROS_ACCOUNT_ID: ${KAIROS_ACCOUNT_ID:-primary}
      KAIROS_ACCOUNT_SNAPSHOT_INTERVAL_S: ${KAIROS_ACCOUNT_SNAPSHOT_INTERVAL_S:-15}
      KAIROS_DRY_RUN_EQUITY_USD: ${KAIROS_DRY_RUN_EQUITY_USD:-10000}
      KAIROS_EVEDEX_EXCHANGE_URL: ${KAIROS_EVEDEX_EXCHANGE_URL:-https://exchange-api.evedex.com}
      KAIROS_EVEDEX_CHAIN_ID: ${KAIROS_EVEDEX_CHAIN_ID:-1}
    networks:
      - bus
      - data
      - egress
      - observability

  ops-exporter:
    <<: *python-service
    build:
      <<: *python-build
      additional_contexts:
        service: https://github.com/Kairos-cryptoAI/kairos-persistence.git#a0e06a07cdf78809b8e9474457a79bbc957b7220
      args:
        PACKAGE_DIR: kairos_persistence
        SOURCE_REPOSITORY: https://github.com/Kairos-cryptoAI/kairos-persistence
        SOURCE_REVISION: a0e06a07cdf78809b8e9474457a79bbc957b7220
    command: ["kairos-persistence-exporter"]
    environment:
      <<: *common-environment
      KAIROS_METRICS_HOST: 0.0.0.0
      KAIROS_METRICS_PORT: "9108"
    expose:
      - "9108"
    ports:
      - 127.0.0.1:${KAIROS_METRICS_PORT:-9108}:9108
    networks:
      - bus
      - data
      - observability
      - management
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9108/metrics', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    pull_policy: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.base.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    networks:
      - observability
      - management
    depends_on:
      ops-exporter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    pull_policy: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-kairos-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/kairos.yml:ro
    secrets:
      - grafana_admin_password
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3000}:3000
    networks:
      - observability
      - management
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10m
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  bus:
    internal: true
  data:
    internal: true
  observability:
    internal: true
  management:
    internal: true
  egress:

volumes:
  redis-data:
  ts-data:
  prometheus-data:
  grafana-data:

secrets:
  redis_password:
    file: ${KAIROS_SECRETS_DIR:-./secrets}/redis_password
  redis_url:
    file: ${KAIROS_SECRETS_DIR:-./secrets}/redis_url
  postgres_password:
    file: ${KAIROS_SECRETS_DIR:-./secrets}/postgres_password
  persistence_database_url:
    file: ${KAIROS_SECRETS_DIR:-./secrets}/persistence_database_url
  grafana_admin_password:
    file: ${KAIROS_SECRETS_DIR:-./secrets}/grafana_admin_password
  deepseek_api_key:
    file: ${KAIROS_SECRETS_DIR:-./secrets}/deepseek_api_key
  openai_api_key:
    file: ${KAIROS_SECRETS_DIR:-./secrets}/openai_api_key
  x_bearer_token:
    file: ${KAIROS_SECRETS_DIR:-./secrets}/x_bearer_token
