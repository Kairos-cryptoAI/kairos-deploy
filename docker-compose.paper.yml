# Isolated technical EVEDEX DEV PAPER topology. No strategy alpha, LLM or feed
# service is started here. A venue mutation is possible only after the operator
# manually invokes the bounded kairos-paper-canary command with the arm phrase.
name: kairos-paper

x-paper-environment: &paper-environment
  KAIROS_ENVIRONMENT: paper
  KAIROS_LOG_LEVEL: INFO
  KAIROS_LOG_JSON: "true"
  KAIROS_BUS_BACKEND: redis
  KAIROS_TRADING_SYMBOLS: '["BTCUSDT","ETHUSDT","SOLUSDT","BNBUSDT","XRPUSDT"]'
  KAIROS_SECRET_BINDINGS: KAIROS_REDIS_URL=/run/secrets/paper_redis_url,KAIROS_PERSISTENCE_DATABASE_URL=/run/secrets/paper_persistence_database_url

x-paper-redis-url-secret: &paper-redis-url-secret
  source: paper_redis_url
  target: paper_redis_url

x-paper-persistence-url-secret: &paper-persistence-url-secret
  source: paper_persistence_database_url
  target: paper_persistence_database_url

x-paper-python-build: &paper-python-build
  context: .
  dockerfile: docker/Dockerfile
  pull: true

x-paper-python-service: &paper-python-service
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  depends_on:
    redis:
      condition: service_healthy
    timescaledb:
      condition: service_healthy
  secrets:
    - *paper-redis-url-secret
    - *paper-persistence-url-secret
  stop_grace_period: 30s
  logging: &paper-logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  redis:
    image: redis:8.2.8-alpine3.22@sha256:a7859ed111db3c1f5404a973a4747505d559fb5ca32d37e447afc0ef845a2103
    user: redis:redis
    pull_policy: always
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        password=$$(cat /run/secrets/paper_redis_password)
        test -n "$$password"
        printf 'appendonly yes\nappendfsync everysec\nrequirepass %s\n' "$$password" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    secrets:
      - paper_redis_password
    expose:
      - "6379"
    volumes:
      - paper-redis-data:/data
    networks:
      - paper-bus
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/paper_redis_password) redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *paper-logging

  timescaledb:
    image: timescale/timescaledb:2.29.1-pg16@sha256:252a443e2936039b83dd8da1373d01e59e932d1054fa6adf1bc061f1d56ae60a
    user: postgres:postgres
    pull_policy: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.paper}
      POSTGRES_PASSWORD_FILE: /run/secrets/paper_postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-kairos}
    secrets:
      - paper_postgres_password
    volumes:
      - paper-ts-data:/var/lib/postgresql/data
      - ./timescaledb/schema.sql:/docker-entrypoint-initdb.d/001-kairos.sql:ro
    networks:
      - paper-data
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = postgres && pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *paper-logging

  quant-scouts:
    <<: *paper-python-service
    build:
      <<: *paper-python-build
      additional_contexts:
        service: https://github.com/Kairos-cryptoAI/kairos-quant-scouts.git#d71d34db569e9441842f1ef4d6c9cfd8628aaea0
      args:
        PACKAGE_DIR: kairos_quant
        SERVICE_EXTRA: ""
        SOURCE_REPOSITORY: https://github.com/Kairos-cryptoAI/kairos-quant-scouts
        SOURCE_REVISION: d71d34db569e9441842f1ef4d6c9cfd8628aaea0
    command: ["kairos-quant-scouts"]
    environment:
      <<: *paper-environment
      KAIROS_ENABLE_VENUE_QUALITY_GATE: "true"
      KAIROS_EVEDEX_DEV_BASE_URL: https://trading-api.evedex.tech
      KAIROS_VENUE_QUALITY_INTERVAL_S: "30"
      KAIROS_MAXIMUM_ABS_BASIS_BPS: "25"
      KAIROS_MAXIMUM_EVEDEX_SPREAD_BPS: "25"
      KAIROS_MAXIMUM_EVEDEX_SLIPPAGE_BPS: "25"
      KAIROS_MAXIMUM_VENUE_BOOK_AGE_MS: "5000"
      KAIROS_MAXIMUM_VENUE_TIMESTAMP_SKEW_MS: "2000"
    networks:
      - paper-bus
      - paper-data
      - paper-observability
      - paper-egress

  strategy-engine:
    <<: *paper-python-service
    build:
      <<: *paper-python-build
      additional_contexts:
        service: https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git#c1bfd51e6efb7942a583196751b89e4c22a4a5e6
      args:
        PACKAGE_DIR: kairos_strategy
        SERVICE_EXTRA: runtime
        SOURCE_REPOSITORY: https://github.com/Kairos-cryptoAI/kairos-strategy-engine
        SOURCE_REVISION: c1bfd51e6efb7942a583196751b89e4c22a4a5e6
    command: ["kairos-strategy-engine"]
    environment:
      <<: *paper-environment
      KAIROS_TRADING_MODE: PAPER
      KAIROS_ENABLED_STRATEGY_IDS: '[]'
    networks:
      - paper-bus
      - paper-data
      - paper-observability

  risk-manager:
    <<: *paper-python-service
    build:
      <<: *paper-python-build
      additional_contexts:
        service: https://github.com/Kairos-cryptoAI/kairos-risk-manager.git#d311872438c35b0eed76fba1eec799ac5999a107
      args:
        PACKAGE_DIR: kairos_risk
        SERVICE_EXTRA: ""
        SOURCE_REPOSITORY: https://github.com/Kairos-cryptoAI/kairos-risk-manager
        SOURCE_REVISION: d311872438c35b0eed76fba1eec799ac5999a107
    command: ["kairos-risk-manager"]
    environment:
      <<: *paper-environment
      KAIROS_TRADING_MODE: PAPER
      KAIROS_EVEDEX_PROFILE: DEV
      KAIROS_PAPER_ACCOUNT_ID: ${KAIROS_PAPER_ACCOUNT_ID:?set KAIROS_PAPER_ACCOUNT_ID in .env.paper}
      KAIROS_PAPER_STRATEGY_ALLOWLIST: '["technical-canary@1"]'
      KAIROS_REQUIRE_RECONCILED_ACCOUNT: "true"
      KAIROS_REQUIRE_STRATEGIC_ALLOCATION: "true"
    networks:
      - paper-bus
      - paper-data
      - paper-observability

  canary-controller:
    <<: *paper-python-service
    profiles:
      - canary
    restart: "no"
    build:
      <<: *paper-python-build
      additional_contexts:
        service: https://github.com/Kairos-cryptoAI/kairos-risk-manager.git#d311872438c35b0eed76fba1eec799ac5999a107
      args:
        PACKAGE_DIR: kairos_risk
        SERVICE_EXTRA: ""
        SOURCE_REPOSITORY: https://github.com/Kairos-cryptoAI/kairos-risk-manager
        SOURCE_REVISION: d311872438c35b0eed76fba1eec799ac5999a107
    # `docker compose run` replaces this argument-free, non-arming default with
    # an explicit symbol/side and the exact arm phrase. `up` never starts this profile.
    command: ["kairos-paper-canary"]
    environment:
      <<: *paper-environment
      KAIROS_TRADING_MODE: PAPER
      KAIROS_EVEDEX_PROFILE: DEV
      KAIROS_PAPER_ACCOUNT_ID: ${KAIROS_PAPER_ACCOUNT_ID:?set KAIROS_PAPER_ACCOUNT_ID in .env.paper}
      KAIROS_PAPER_STRATEGY_ALLOWLIST: '["technical-canary@1"]'
      KAIROS_REQUIRE_RECONCILED_ACCOUNT: "true"
      KAIROS_REQUIRE_STRATEGIC_ALLOCATION: "true"
    networks:
      - paper-bus
      - paper-data
      - paper-observability

  execution-engine:
    <<: *paper-python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.paper-execution
      pull: true
      additional_contexts:
        service: https://github.com/Kairos-cryptoAI/kairos-execution-engine.git#de168290a9331accaf4c3aa2b62407b5adf7c614
      args:
        PACKAGE_DIR: kairos_execution
        SERVICE_EXTRA: evedex
        SOURCE_REPOSITORY: https://github.com/Kairos-cryptoAI/kairos-execution-engine
        SOURCE_REVISION: de168290a9331accaf4c3aa2b62407b5adf7c614
    command: ["kairos-execution-engine"]
    environment:
      <<: *paper-environment
      KAIROS_TRADING_MODE: PAPER
      KAIROS_EXCHANGE: evedex
      KAIROS_ACCOUNT_ID: ${KAIROS_PAPER_ACCOUNT_ID:?set KAIROS_PAPER_ACCOUNT_ID in .env.paper}
      KAIROS_EVEDEX_PROFILE: DEV
      KAIROS_EVEDEX_EXCHANGE_URL: https://trading-api.evedex.tech
      KAIROS_EVEDEX_AUTH_URL: https://auth-api.evedex.tech
      KAIROS_EVEDEX_WEBSOCKET_URL: wss://ws.evedex.tech/connection/websocket
      KAIROS_EVEDEX_WEBSOCKET_PREFIX: futures-perp-dev
      KAIROS_EVEDEX_CHAIN_ID: "16182"
      KAIROS_EVEDEX_DEV_SYMBOL_MAP: '{"BTCUSDT":"BTCUSD:DEV","ETHUSDT":"ETHUSD:DEV","SOLUSDT":"SOLUSD:DEV","BNBUSDT":"BNBUSD:DEV","XRPUSDT":"XRPUSD:DEV"}'
      KAIROS_EVEDEX_DEV_EXPECTED_ACCOUNT_ID: ${KAIROS_EVEDEX_DEV_EXPECTED_ACCOUNT_ID:?set remote DEV account id in .env.paper}
      KAIROS_EVEDEX_DEV_API_KEY_FILE: /run/secrets/evedex_dev_api_key
      KAIROS_EVEDEX_DEV_PRIVATE_KEY_FILE: /run/secrets/evedex_dev_private_key
    secrets:
      - *paper-redis-url-secret
      - *paper-persistence-url-secret
      - source: evedex_dev_api_key
        target: evedex_dev_api_key
      - source: evedex_dev_private_key
        target: evedex_dev_private_key
    networks:
      - paper-bus
      - paper-data
      - paper-observability
      - paper-egress

  ops-exporter:
    <<: *paper-python-service
    build:
      <<: *paper-python-build
      additional_contexts:
        service: https://github.com/Kairos-cryptoAI/kairos-persistence.git#e36a3c01aa8aa3847bfbc8fa42eb4f98794d28a5
      args:
        PACKAGE_DIR: kairos_persistence
        SERVICE_EXTRA: ""
        SOURCE_REPOSITORY: https://github.com/Kairos-cryptoAI/kairos-persistence
        SOURCE_REVISION: e36a3c01aa8aa3847bfbc8fa42eb4f98794d28a5
    command: ["kairos-persistence-exporter"]
    environment:
      <<: *paper-environment
      KAIROS_METRICS_HOST: 0.0.0.0
      KAIROS_METRICS_PORT: "9108"
    expose:
      - "9108"
    ports:
      - 127.0.0.1:${KAIROS_PAPER_METRICS_PORT:-19108}:9108
    networks:
      - paper-bus
      - paper-data
      - paper-observability
      - paper-management
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9108/metrics', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  prometheus:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    pull_policy: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - paper-prometheus-data:/prometheus
    ports:
      - 127.0.0.1:${KAIROS_PAPER_PROMETHEUS_PORT:-19090}:9090
    networks:
      - paper-observability
      - paper-management
    depends_on:
      ops-exporter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *paper-logging

  grafana:
    image: grafana/grafana:12.4.8@sha256:7753ad493720e33560077e8bc5e05fbce4ade777f1387b19ab5050b6777111dd
    pull_policy: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-kairos-paper-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/paper_grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - paper-grafana-data:/var/lib/grafana
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/kairos.yml:ro
    secrets:
      - paper_grafana_admin_password
    ports:
      - 127.0.0.1:${KAIROS_PAPER_GRAFANA_PORT:-13000}:3000
    networks:
      - paper-observability
      - paper-management
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10m
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *paper-logging

networks:
  paper-bus:
    internal: true
  paper-data:
    internal: true
  paper-observability:
    internal: true
  paper-management:
    internal: true
  paper-egress:

volumes:
  paper-redis-data:
  paper-ts-data:
  paper-prometheus-data:
  paper-grafana-data:

secrets:
  paper_redis_password:
    file: ${KAIROS_PAPER_SECRETS_DIR:-./secrets-paper}/redis_password
  paper_redis_url:
    file: ${KAIROS_PAPER_SECRETS_DIR:-./secrets-paper}/redis_url
  paper_postgres_password:
    file: ${KAIROS_PAPER_SECRETS_DIR:-./secrets-paper}/postgres_password
  paper_persistence_database_url:
    file: ${KAIROS_PAPER_SECRETS_DIR:-./secrets-paper}/persistence_database_url
  paper_grafana_admin_password:
    file: ${KAIROS_PAPER_SECRETS_DIR:-./secrets-paper}/grafana_admin_password
  evedex_dev_api_key:
    file: ${KAIROS_PAPER_SECRETS_DIR:-./secrets-paper}/evedex_dev_api_key
  evedex_dev_private_key:
    file: ${KAIROS_PAPER_SECRETS_DIR:-./secrets-paper}/evedex_dev_private_key
