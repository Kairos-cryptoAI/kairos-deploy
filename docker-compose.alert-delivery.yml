# Standalone opt-in operational project: no DB, business service or host port.
name: kairos-ops-alerts
services:
  alertmanager:
    image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    platform: linux/amd64
    profiles: [alert-delivery]
    user: "65534:65534"
    read_only: true
    init: true
    restart: "no"
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=:9093
      - --cluster.listen-address=
      - --data.retention=24h
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /alertmanager:rw,noexec,nosuid,nodev,size=8m,uid=65534,gid=65534,mode=0700
    volumes:
      - type: bind
        source: ${KAIROS_ALERT_CONFIG:?explicit rendered config required}
        target: /etc/alertmanager/alertmanager.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${KAIROS_ALERT_TOKEN_FILE:?dedicated operator imported token FILE required}
        target: /run/secrets/telegram_bot_token
        read_only: true
        bind:
          create_host_path: false
    networks:
      alert-input:
        aliases: [kairos-ops-alertmanager]
      alert-egress: {}
networks:
  alert-input:
    external: true
    name: kairos_observability
  alert-egress:
    driver: bridge
