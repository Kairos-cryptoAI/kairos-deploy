name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate source lock
        run: |
          python scripts/validate_deployment.py
          python scripts/validate_paper_deployment.py
          python scripts/validate_sim_deployment.py
          python scripts/validate_sim_full_path_deployment.py
          python scripts/validate_current_release_gate.py
          python scripts/validate_current_release_projection.py
          python scripts/validate_offline_outbox_reconciliation.py
          python scripts/validate_offline_outbox_drain.py
          python scripts/validate_legacy_outbox_inspection.py
          python scripts/validate_legacy_outbox_quarantine_clone_rehearsal.py
          python scripts/validate_schema_upgrade_preflight.py
      - name: Run validator tests
        run: python -m unittest discover -s tests -v
      - name: Test offline bar recovery preflight
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./scripts/Test-LongGapRecovery.ps1
          ./scripts/Test-OfflineRecoveryObservation.ps1

  cockpit:
    name: Cockpit / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: monitoring/cockpit
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: Install locked Cockpit dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test Cockpit API and chart contracts
        run: npm test
      - name: Build Cockpit production bundle
        run: npm run build

  validate:
    needs: static-python
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate source lock and remote lockfiles
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/validate_deployment.py --verify-remote
          python scripts/validate_paper_deployment.py --verify-remote
          python scripts/validate_sim_deployment.py --verify-remote
          python scripts/validate_sim_full_path_deployment.py --verify-remote
          python scripts/validate_current_release_gate.py --verify-remote
          python scripts/validate_current_release_projection.py
          python scripts/validate_offline_outbox_reconciliation.py --verify-remote
          python scripts/validate_offline_outbox_drain.py --verify-remote
          python scripts/validate_legacy_outbox_inspection.py --verify-remote
      - name: Render Compose configuration
        run: docker compose --env-file .env.example -f docker-compose.yml config --format json > compose.json
      - name: Validate rendered Compose security
        run: python scripts/validate_deployment.py --compose-json compose.json
      - name: Validate Compose model
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet
      - name: Validate fail-closed LIVE overlay
        run: |
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.live.yml config --format json > compose-live.json
          python scripts/validate_deployment.py --compose-json compose-live.json --live
      - name: Validate isolated EVEDEX DEV PAPER topology
        run: |
          docker compose --profile canary --env-file .env.paper.example -f docker-compose.paper.yml config --format json > compose-paper.json
          python scripts/validate_paper_deployment.py --compose-json compose-paper.json --env-file .env.paper.example --allow-example-values
          docker compose --profile canary --env-file .env.paper.example -f docker-compose.paper.yml config --quiet
      - name: Validate isolated offline simulator topology
        run: |
          docker compose --env-file tests/sim_gate/empty.env -p kairos-sim -f docker-compose.sim.yml config --format json > compose-sim.json
          python scripts/validate_sim_deployment.py --compose-json compose-sim.json --dockerfile tests/sim_gate/Dockerfile
          docker compose --env-file tests/sim_gate/empty.env -p kairos-sim -f docker-compose.sim.yml config --quiet
      - name: Validate isolated full-path simulator topology
        run: |
          docker compose --env-file tests/sim_full_path_gate/empty.env -p kairos-sim-full-path-gate-20260923-r2 -f docker-compose.sim-full-path.yml config --format json > compose-sim-full-path.json
          python scripts/validate_sim_full_path_deployment.py --compose-json compose-sim-full-path.json --dockerfile tests/sim_full_path_gate/Dockerfile
          docker compose --env-file tests/sim_full_path_gate/empty.env -p kairos-sim-full-path-gate-20260923-r2 -f docker-compose.sim-full-path.yml config --quiet
      - name: Validate current-source REJECT_ALL topology
        run: |
          docker compose -p kairos-current-release-gate-20260923-r2 -f docker-compose.current-release-gate.yml config --format json > compose-current-release-gate.json
          python scripts/validate_current_release_gate.py --compose-json compose-current-release-gate.json --dockerfile tests/current_release_gate/Dockerfile
          docker compose -p kairos-current-release-gate-20260923-r2 -f docker-compose.current-release-gate.yml config --quiet
      - name: Validate profile-only offline outbox reconciliation topology
        run: |
          docker compose --env-file .env.outbox-reconciliation.example -f docker-compose.outbox-reconciliation.yml config --format json > compose-outbox-reconciliation-normal-up.json
          python scripts/validate_offline_outbox_reconciliation.py --normal-up-compose-json compose-outbox-reconciliation-normal-up.json
          docker compose --profile offline-outbox-inspect --profile offline-outbox-apply --env-file .env.outbox-reconciliation.example -f docker-compose.outbox-reconciliation.yml config --format json > compose-outbox-reconciliation.json
          python scripts/validate_offline_outbox_reconciliation.py --compose-json compose-outbox-reconciliation.json --dockerfile tests/offline_outbox_reconciliation/Dockerfile
          docker compose --profile offline-outbox-inspect --profile offline-outbox-apply --env-file .env.outbox-reconciliation.example -f docker-compose.outbox-reconciliation.yml config --quiet
      - name: Validate profile-only signed offline outbox drain topology
        run: |
          docker compose --env-file .env.outbox-drain.example -f docker-compose.outbox-drain.yml config --format json > compose-outbox-drain-normal-up.json
          python scripts/validate_offline_outbox_drain.py --normal-up-compose-json compose-outbox-drain-normal-up.json
          docker compose --profile offline-outbox-drain-inspect --profile offline-outbox-drain-apply --env-file .env.outbox-drain.example -f docker-compose.outbox-drain.yml config --format json > compose-outbox-drain.json
          python scripts/validate_offline_outbox_drain.py --compose-json compose-outbox-drain.json --dockerfile tests/offline_outbox_drain/Dockerfile
          docker compose --profile offline-outbox-drain-inspect --profile offline-outbox-drain-apply --env-file .env.outbox-drain.example -f docker-compose.outbox-drain.yml config --quiet
      - name: Validate profile-only legacy outbox inspection topology
        run: |
          docker compose --env-file .env.legacy-outbox-inspection.example -f docker-compose.legacy-outbox-inspection.yml config --format json > compose-legacy-outbox-normal-up.json
          python scripts/validate_legacy_outbox_inspection.py --normal-up-compose-json compose-legacy-outbox-normal-up.json
          docker compose --profile legacy-outbox-inspect --env-file .env.legacy-outbox-inspection.example -f docker-compose.legacy-outbox-inspection.yml config --format json > compose-legacy-outbox.json
          python scripts/validate_legacy_outbox_inspection.py --compose-json compose-legacy-outbox.json --dockerfile tests/legacy_outbox_inspection/Dockerfile
          docker compose --profile legacy-outbox-inspect --env-file .env.legacy-outbox-inspection.example -f docker-compose.legacy-outbox-inspection.yml config --quiet
      - name: Validate Prometheus rules
        run: >-
          docker run --rm
          -v "$PWD/monitoring:/etc/prometheus:ro"
          --entrypoint promtool
          prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
          check config /etc/prometheus/prometheus.yml
      - name: Validate base and PAPER alert rules
        run: >-
          docker run --rm
          -v "$PWD/monitoring:/etc/prometheus:ro"
          --entrypoint promtool
          prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
          check rules /etc/prometheus/alerts.base.yml /etc/prometheus/alerts.yml
      - name: Lint Dockerfile
        run: >-
          docker run --rm
          -v "$PWD:/work:ro"
          -w /work
          hadolint/hadolint:v2.14.0-debian@sha256:158cd0184dcaa18bd8ec20b61f4c1cabdf8b32a592d062f57bdcb8e4c1d312e2
          hadolint docker/Dockerfile docker/Dockerfile.paper-execution tests/sim_gate/Dockerfile tests/sim_full_path_gate/Dockerfile tests/current_release_gate/Dockerfile tests/offline_outbox_reconciliation/Dockerfile tests/offline_outbox_drain/Dockerfile tests/legacy_outbox_inspection/Dockerfile

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - quant-scouts
          - strategy-engine
          - text-scouts
          - router
          - aggregator
          - macro-strategist
          - risk-manager
          - execution-engine
          - ops-exporter
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pinned service image
        env:
          DOCKER_BUILD_SUMMARY: "false"
        run: docker compose --env-file .env.example -f docker-compose.yml build --pull ${{ matrix.service }}

  build-paper:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - quant-scouts
          - strategy-engine
          - risk-manager
          - canary-controller
          - execution-engine
          - ops-exporter
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pinned PAPER service image
        env:
          DOCKER_BUILD_SUMMARY: "false"
        run: >-
          docker compose --profile canary --env-file .env.paper.example
          -f docker-compose.paper.yml build --pull ${{ matrix.service }}
