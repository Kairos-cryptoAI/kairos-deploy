name: simulator-gate

on:
  push:
    branches: [main]
    paths:
      - "docker-compose.sim.yml"
      - "sim.sources.lock.json"
      - "scripts/validate_sim_deployment.py"
      - "tests/sim_gate/**"
      - "tests/test_validate_sim_deployment.py"
      - ".github/workflows/simulator-gate.yml"
  pull_request:
    paths:
      - "docker-compose.sim.yml"
      - "sim.sources.lock.json"
      - "scripts/validate_sim_deployment.py"
      - "tests/sim_gate/**"
      - "tests/test_validate_sim_deployment.py"
      - ".github/workflows/simulator-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy:
    name: SIM isolation / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.11"
      - name: Validate sealed SIM manifest and Dockerfile
        run: python scripts/validate_sim_deployment.py
      - name: Run hermetic simulator policy tests
        run: python -m unittest tests/test_validate_sim_deployment.py -v

  docker-integration:
    name: Actual sealed SIM / PostgreSQL / Redis / controller
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Require a fresh isolated simulator project
        id: fresh_project
        timeout-minutes: 2
        run: |
          mkdir simulator-gate-evidence
          git rev-parse HEAD > simulator-gate-evidence/deploy-revision.txt
          project=kairos-sim
          test -z "$(timeout --kill-after=5s 10s docker ps -aq --filter label=com.docker.compose.project=$project)"
          test -z "$(timeout --kill-after=5s 10s docker network ls -q --filter label=com.docker.compose.project=$project)"
          test -z "$(timeout --kill-after=5s 10s docker volume ls -q --filter label=com.docker.compose.project=$project)"
          docker compose --env-file tests/sim_gate/empty.env -p "$project" -f docker-compose.sim.yml config --format json > simulator-gate-evidence/compose.json
          python scripts/validate_sim_deployment.py --compose-json simulator-gate-evidence/compose.json --dockerfile tests/sim_gate/Dockerfile
          docker compose --env-file tests/sim_gate/empty.env -p "$project" -f docker-compose.sim.yml config --quiet
      - name: Build only the pinned simulator test image
        timeout-minutes: 10
        run: |
          docker compose --env-file tests/sim_gate/empty.env -p kairos-sim -f docker-compose.sim.yml build sim-gate 2>&1 | tee simulator-gate-evidence/build.log
      - name: Start only disposable isolated data services
        timeout-minutes: 3
        run: |
          docker compose --env-file tests/sim_gate/empty.env -p kairos-sim -f docker-compose.sim.yml up -d --wait --wait-timeout 90 timescaledb redis
      - name: Run one bounded durable simulator proof
        timeout-minutes: 5
        run: |
          compose=(docker compose --env-file tests/sim_gate/empty.env -p kairos-sim -f docker-compose.sim.yml)
          "${compose[@]}" up -d --no-deps sim-gate
          gate_id=$("${compose[@]}" ps -a -q sim-gate)
          test -n "$gate_id"
          test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' "$gate_id")" = kairos-sim
          set +e
          gate_exit=$(timeout --signal=TERM --kill-after=15s 180s docker wait "$gate_id")
          wait_exit=$?
          set -e
          if [ "$wait_exit" -ne 0 ]; then
            "${compose[@]}" stop --timeout 30 sim-gate
          fi
          docker logs --timestamps "$gate_id" 2>&1 | tee simulator-gate-evidence/controller.log
          printf '%s\n' "wait_exit=$wait_exit" "container_exit=$gate_exit" > simulator-gate-evidence/exit-status.txt
          test "$wait_exit" -eq 0
          test "$gate_exit" = 0
      - name: Preserve synthetic evidence before hosted-runner disposal
        if: always()
        timeout-minutes: 3
        run: |
          mkdir -p simulator-gate-evidence
          if [ "${{ steps.fresh_project.outcome }}" != success ]; then
            printf 'capture\tSKIPPED_PROJECT_NOT_VERIFIED\n' > simulator-gate-evidence/capture-status.tsv
            exit 0
          fi
          compose=(docker compose --env-file tests/sim_gate/empty.env -p kairos-sim -f docker-compose.sim.yml)
          printf 'operation\tstatus\n' > simulator-gate-evidence/capture-status.tsv
          "${compose[@]}" logs --no-color --timestamps > simulator-gate-evidence/services.log
          printf 'services\tCOMPLETE\n' >> simulator-gate-evidence/capture-status.tsv
          "${compose[@]}" ps -a --format json > simulator-gate-evidence/containers.json
          printf 'containers\tCOMPLETE\n' >> simulator-gate-evidence/capture-status.tsv
          "${compose[@]}" exec -T timescaledb pg_dump -U kairos -d kairos_sim_controller_202609190001 --format=custom > simulator-gate-evidence/simulator.dump
          sha256sum simulator-gate-evidence/simulator.dump > simulator-gate-evidence/simulator.dump.sha256
          printf 'pg_dump\tCOMPLETE\n' >> simulator-gate-evidence/capture-status.tsv
      - name: Upload disposable synthetic evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simulator-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: simulator-gate-evidence/
          if-no-files-found: error
          retention-days: 30
          overwrite: false
