name: kairos-sim

# This is a disposable offline proof gate, not a PAPER or venue runtime.  It
# derives only SIMULATED outcomes from sealed test bars and top-N book frames.
# Docker may fetch pinned source while building; all runtime services share an
# internal-only network and receive no secrets or external endpoint settings.
services:
  timescaledb:
    image: timescale/timescaledb:2.30.1-pg16@sha256:f495f2bc25ca7596ca8e1606c6241ca250ccc56a0c082b9f2ec0d290e0126cd9
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: synthetic_sim_gate_only
      POSTGRES_DB: kairos_sim_controller_202609190001
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "max_worker_processes=8", "-c", "timescaledb.max_background_workers=4"]
    tmpfs:
      - /var/lib/postgresql/data:rw,nosuid,size=512m
    shm_size: 128m
    mem_limit: 768m
    networks: [isolated]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos -d kairos_sim_controller_202609190001"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"

  redis:
    image: redis:8.4.5-alpine3.22@sha256:bd4a0d37e7cd830117ffec9329052b4a1887afa060c265e1768f82b177ff6f43
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs: ["/data:rw,nosuid,size=64m"]
    networks: [isolated]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"

  sim-gate:
    build:
      context: tests/sim_gate
      dockerfile: Dockerfile
    image: kairos-sim-gate-tests:20260919-r1
    environment:
      KAIROS_SIM_GATE_CONFIRM: ISOLATED_SIMULATOR_GATE_ONLY
      KAIROS_SIM_GATE_PROJECT: kairos-sim
      KAIROS_SIM_CONTROLLER_DATABASE_URL: postgresql://kairos:synthetic_sim_gate_only@timescaledb:5432/kairos_sim_controller_202609190001
    depends_on:
      timescaledb: {condition: service_healthy}
      redis: {condition: service_healthy}
    read_only: true
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 128
    tmpfs: ["/tmp:rw,nosuid,size=256m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [isolated]
    restart: "no"

networks:
  isolated:
    internal: true
