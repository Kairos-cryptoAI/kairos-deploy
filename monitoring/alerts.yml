groups:
  - name: kairos-durable-runtime
    rules:
      - alert: KairosDurableExporterUnavailable
        expr: up{job="kairos-durable-runtime"} != 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Kairos durable runtime metrics exporter is unavailable
      - alert: KairosPersistenceUnavailable
        expr: kairos_persistence_up != 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Kairos TimescaleDB is unavailable to the durable runtime exporter
      - alert: KairosRedisUnavailable
        expr: kairos_redis_up != 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Kairos Redis is unavailable to the durable runtime exporter
      - alert: KairosOutboxBacklog
        expr: kairos_outbox_pending > 0 and kairos_outbox_oldest_age_seconds > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Kairos durable outbox is not draining
      - alert: KairosDeadLetters
        expr: kairos_outbox_dead_lettered_total > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Kairos outbox contains dead-lettered messages
      - alert: KairosInboxFailures
        expr: kairos_inbox_failed > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Kairos durable inbox contains failed messages
      - alert: KairosExpiredInboxLease
        expr: kairos_inbox_processing_expired > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Kairos inbox contains an expired processing lease requiring recovery
      - alert: KairosUnresolvedExecutionMutation
        expr: kairos_execution_effects_prepared > 0 or kairos_execution_effects_failed > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: An exchange mutation requires reconciliation
      - alert: KairosClosedBarGap
        expr: kairos_closed_bar_gaps_24h > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: A persisted Binance one-minute stream contains a gap or reorder boundary
      - alert: KairosClosedBarCoverageIncomplete
        expr: kairos_closed_bar_symbols_24h != 5 or kairos_closed_bar_minimum_coverage_ratio_24h < 0.999
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: The PAPER 24-hour closed-bar qualification window is incomplete
      - alert: KairosClosedBarStreamStale
        expr: kairos_closed_bar_latest_age_seconds > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: At least one PAPER Binance closed-bar stream is stale
      - alert: KairosVenueAvailabilityBelowGate
        expr: kairos_venue_poll_expected_24h != 14400 or kairos_venue_availability_ratio_24h < 0.99
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: EVEDEX DEV read-only availability is below the 99 percent gate
      - alert: KairosVenueMeasurementStale
        expr: kairos_venue_measurements_24h < 1 or kairos_venue_latest_age_seconds > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: No fresh EVEDEX DEV venue-quality measurement is available
      - alert: KairosVenueEconomicsOutsideGate
        expr: kairos_venue_p95_abs_basis_bps > 25 or kairos_venue_p95_spread_bps > 25 or kairos_venue_p95_slippage_bps > 25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: EVEDEX DEV basis, spread, or executable slippage exceeds 25 bps
      - alert: KairosVenueTimingOutsideGate
        expr: kairos_venue_max_book_age_ms > 5000 or kairos_venue_max_timestamp_skew_ms > 2000 or kairos_venue_p95_latency_ms > 5000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: EVEDEX DEV book freshness, timestamp skew, or latency exceeds the PAPER gate
      - alert: KairosPaperExposureUnprotected
        expr: kairos_paper_unprotected_trades > 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: A filled PAPER position has no reconciled protective stop
      - alert: KairosPaperRecoveryBlocked
        expr: kairos_paper_recovery_blocked > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: PAPER entries remain blocked because authoritative recovery is incomplete
      - alert: KairosPaperAccountSnapshotStale
        expr: kairos_paper_account_latest_age_seconds < 0 or kairos_paper_account_latest_age_seconds > 60
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: PAPER readiness is not backed by a fresh reconciled account snapshot
      - alert: KairosExecutionShortfallOutsideGate
        expr: kairos_execution_p95_shortfall_bps > 25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: PAPER entry execution shortfall exceeds 25 bps at p95
      - alert: KairosQualificationBudgetExceeded
        expr: kairos_api_spend_month_usd > 15
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Durable API qualification spend exceeded the hard 15 USD cap
      - alert: KairosExecutionRuntimeHealthStale
        expr: kairos_execution_runtime_health_age_seconds < 0 or kairos_execution_runtime_health_age_seconds > 60
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Durable EVEDEX execution health is missing or stale
      - alert: KairosEvedexAuthNearExpiry
        expr: kairos_evedex_auth_expires_in_seconds < 60
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: EVEDEX DEV authentication is unknown, expired, or near expiry
      - alert: KairosEvedexMutationBudgetUnsafe
        expr: kairos_evedex_local_mutation_capacity != 30 or kairos_evedex_local_mutation_compensation_reserve < 4 or kairos_evedex_local_mutation_window_seconds < 60
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: EVEDEX mutation budget no longer preserves the fixed safety boundary
      - alert: KairosEvedexCompensationReserveExhausted
        expr: kairos_evedex_local_mutation_reserve < kairos_evedex_local_mutation_compensation_reserve
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: EVEDEX cancel and emergency-close mutation reserve is exhausted
      - alert: KairosEvedexVenueRateLimitExhausted
        expr: kairos_evedex_venue_rate_limit_observable == 1 and kairos_evedex_venue_rate_limit_reserve < 1
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: EVEDEX reported no remaining venue-side request capacity
